<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ランダムダンジョン TRPG補助ツール</title><script src="https://cdn.tailwindcss.com"></script><style>  @keyframes diceRoll {    0%   { transform: rotate(0deg) scale(1); }    25%  { transform: rotate(90deg) scale(1.3); }    50%  { transform: rotate(180deg) scale(0.8); }    75%  { transform: rotate(270deg) scale(1.2); }    100% { transform: rotate(360deg) scale(1); }  }  @keyframes resultPop {    0%   { transform: scale(0.8) translateY(5px); opacity: 0; }    70%  { transform: scale(1.05) translateY(-2px); }    100% { transform: scale(1) translateY(0); opacity: 1; }  }  @keyframes fadeSlide {    from { opacity: 0; transform: translateY(15px); }    to   { opacity: 1; transform: translateY(0); }  }  .dice-spin { animation: diceRoll 0.5s cubic-bezier(.36,.07,.19,.97) forwards; }  .result-pop { animation: resultPop 0.4s ease-out forwards; }  .fade-slide { animation: fadeSlide 0.5s ease-out forwards; }  .dungeon-bg {    background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);  }  .card {    background: rgba(15,23,42,0.8);    border: 1px solid rgba(99,102,241,0.3);    backdrop-filter: blur(4px);  }  .room-card {    background: rgba(30,27,75,0.6);    border: 1px solid rgba(99,102,241,0.4);  }  .dice-btn {    background: rgba(49,46,129,0.5);    border: 1px solid rgba(99,102,241,0.5);    transition: all 0.2s;  }  .dice-btn:hover {    background: rgba(99,102,241,0.3);    border-color: rgba(129,140,248,0.8);    transform: translateY(-2px);    box-shadow: 0 4px 12px rgba(99,102,241,0.3);  }  .dice-btn:active { transform: scale(0.95); }  .exit-dot { width:8px; height:8px; border-radius:50%; background:#818cf8; }  :focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }  .note-item:hover { background: rgba(99,102,241,0.1); }  .tag { display:inline-block; padding:2px 8px; border-radius:9999px; font-size:0.7rem; font-weight:600; }</style></head><body class="dungeon-bg min-h-screen text-indigo-100 font-sans"><header class="border-b border-indigo-900/60 px-4 py-4">  <div class="max-w-5xl mx-auto flex items-center gap-3">    <span class="text-3xl" aria-hidden="true">⚔</span>    <div>      <h1 class="text-xl font-bold text-indigo-200">ランダムダンジョン ダイスロール</h1>      <p class="text-indigo-500 text-sm">TRPG Dungeon Generator & Dice Roller</p>    </div>  </div></header><main class="max-w-5xl mx-auto px-4 py-6">  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">    <!-- Left column: Dice + Generate -->    <div class="lg:col-span-1 space-y-5">      <!-- Dice Roller -->      <section class="card rounded-xl p-5" aria-label="ダイスロール">        <h2 class="text-indigo-300 font-semibold mb-4">ダイスロール</h2>        <div class="grid grid-cols-4 gap-2 mb-4">          <button class="dice-btn rounded-lg py-3 text-center font-bold text-indigo-200"            onclick="rollDice(4)" aria-label="4面ダイスを振る">            <div class="text-lg dice-icon" id="die-4">▲</div>            <div class="text-xs text-indigo-400">d4</div>          </button>          <button class="dice-btn rounded-lg py-3 text-center font-bold text-indigo-200"            onclick="rollDice(6)" aria-label="6面ダイスを振る">            <div class="text-lg dice-icon" id="die-6">⬡</div>            <div class="text-xs text-indigo-400">d6</div>          </button>          <button class="dice-btn rounded-lg py-3 text-center font-bold text-indigo-200"            onclick="rollDice(8)" aria-label="8面ダイスを振る">            <div class="text-lg dice-icon" id="die-8">◆</div>            <div class="text-xs text-indigo-400">d8</div>          </button>          <button class="dice-btn rounded-lg py-3 text-center font-bold text-indigo-200"            onclick="rollDice(10)" aria-label="10面ダイスを振る">            <div class="text-lg dice-icon" id="die-10">◈</div>            <div class="text-xs text-indigo-400">d10</div>          </button>          <button class="dice-btn rounded-lg py-3 text-center font-bold text-indigo-200"            onclick="rollDice(12)" aria-label="12面ダイスを振る">            <div class="text-lg dice-icon" id="die-12">⬟</div>            <div class="text-xs text-indigo-400">d12</div>          </button>          <button class="dice-btn rounded-lg py-3 text-center font-bold text-indigo-200"            onclick="rollDice(20)" aria-label="20面ダイスを振る">            <div class="text-lg dice-icon" id="die-20">⬠</div>            <div class="text-xs text-indigo-400">d20</div>          </button>          <button class="dice-btn rounded-lg py-3 text-center font-bold text-indigo-200 col-span-2"            onclick="rollDice(100)" aria-label="100面ダイスを振る">            <div class="text-sm dice-icon" id="die-100">d%</div>            <div class="text-xs text-indigo-400">d100</div>          </button>        </div>        <!-- Multiple dice -->        <div class="flex gap-2 mb-3">          <div class="flex-1">            <label class="text-xs text-indigo-400 block mb-1" for="dice-count">個数</label>            <input id="dice-count" type="number" min="1" max="20" value="2"              class="w-full bg-indigo-950/50 border border-indigo-700 rounded px-2 py-1.5 text-sm text-indigo-200 text-center focus:outline-none focus:border-indigo-400">          </div>          <div class="flex-1">            <label class="text-xs text-indigo-400 block mb-1" for="dice-sides">面数</label>            <select id="dice-sides"              class="w-full bg-indigo-950/50 border border-indigo-700 rounded px-2 py-1.5 text-sm text-indigo-200 focus:outline-none focus:border-indigo-400">              <option>4</option><option>6</option><option>8</option><option>10</option>              <option>12</option><option selected>20</option><option>100</option>            </select>          </div>          <div class="self-end">            <button onclick="rollMultiple()"              class="dice-btn rounded-lg px-3 py-2 text-sm text-indigo-200 font-semibold">              振る            </button>          </div>        </div>        <div id="dice-result" class="bg-indigo-950/60 rounded-lg p-3 text-center min-h-16 flex flex-col items-center justify-center"          aria-live="polite" aria-label="ダイスの結果">          <div class="text-indigo-500 text-sm">ダイスを振ってください</div>        </div>      </section>      <!-- Generate Room Button -->      <button onclick="generateRoom()"        class="w-full py-4 bg-indigo-700 hover:bg-indigo-600 text-white font-bold text-lg rounded-xl border border-indigo-500 transition-all hover:shadow-lg hover:shadow-indigo-900/50"        aria-label="ランダムダンジョン部屋を生成する">        ⚔ ランダム部屋を生成      </button>      <!-- Notes -->      <section class="card rounded-xl p-5" aria-label="部屋メモ">        <h2 class="text-indigo-300 font-semibold mb-3">部屋メモ <span class="text-indigo-600 text-xs font-normal">(自動保存)</span></h2>        <textarea id="note-input" placeholder="メモを入力..." rows="3"          class="w-full bg-indigo-950/50 border border-indigo-700 rounded-lg p-2 text-sm text-indigo-200 resize-none focus:outline-none focus:border-indigo-400 mb-2"          aria-label="メモ入力欄"></textarea>        <button onclick="saveNote()"          class="w-full py-1.5 bg-indigo-800 hover:bg-indigo-700 text-indigo-200 text-sm rounded-lg border border-indigo-600 transition-all">          メモを保存        </button>        <div id="notes-list" class="mt-3 space-y-2 max-h-40 overflow-y-auto"></div>      </section>    </div>    <!-- Right column: Room results -->    <div class="lg:col-span-2 space-y-4">      <div id="room-placeholder" class="card rounded-xl p-10 text-center text-indigo-600">        <div class="text-5xl mb-4" aria-hidden="true">🏰</div>        <p>「ランダム部屋を生成」ボタンを押して<br>ダンジョンを探索しましょう</p>      </div>      <div id="room-result" class="hidden"></div>      <div id="roll-history" class="card rounded-xl p-4">        <h2 class="text-indigo-400 text-sm font-semibold mb-3">ロール履歴</h2>        <div id="roll-log" class="space-y-1 max-h-40 overflow-y-auto text-xs text-indigo-500">          <div class="text-center text-indigo-700">まだロールがありません</div>        </div>      </div>    </div>  </div></main><script>function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }// --- Tables ---const ROOM_TYPES = [  { name:'通路', en:'Corridor', icon:'🏛', color:'bg-slate-700', desc:'石造りの通路。両側に松明の架け台がある。' },  { name:'部屋', en:'Chamber', icon:'🚪', color:'bg-indigo-800', desc:'広い部屋。石の壁に文様が刻まれている。' },  { name:'宝物庫', en:'Treasury', icon:'💰', color:'bg-amber-800', desc:'重厚な扉に囲まれた宝物庫。金庫のにおいが漂う。' },  { name:'罠部屋', en:'Trap Room', icon:'⚠', color:'bg-red-800', desc:'床に不自然な模様がある。慎重に進むべきだ。' },  { name:'神殿', en:'Shrine', icon:'🕌', color:'bg-purple-800', desc:'古代の神々を祀る神殿。空気が澄み、神聖な雰囲気が漂う。' },  { name:'ボス部屋', en:'Boss Lair', icon:'🐉', color:'bg-orange-900', desc:'巨大な扉の向こう。重い呼吸音と地響きが聞こえる。' },];const SIZES = ['小（3×3m）','中（6×6m）','大（10×10m）','広大（20×20m以上）'];const DIRECTIONS = ['北','東','南','西'];const ENCOUNTER_TABLE = [  { range:[1,5],  label:'静寂', desc:'部屋は空だ。しかし最近誰かがいた形跡がある。', severity:'safe', color:'text-green-400' },  { range:[6,10], label:'軽度の脅威', desc:'弱い魔物の気配。準備すれば問題ない。', severity:'low', color:'text-yellow-400' },  { range:[11,15],label:'中程度の脅威', desc:'鍛えられた敵が待ち構えている。油断禁物。', severity:'mid', color:'text-orange-400' },  { range:[16,19],label:'宝物', desc:'誰かが残した宝が見つかった！', severity:'treasure', color:'text-amber-300' },  { range:[20,20],label:'ボスエンカウント', desc:'強大な存在の気配…全力で挑め！', severity:'boss', color:'text-red-400' },];const MONSTERS = [  'コボルド','ゴブリン','オーク','トロール','スケルトン',  'ゾンビ','ハーピー','ワイバーン'];const MONSTER_CR = ['CR 1/8','CR 1/4','CR 1/2','CR 1','CR 2','CR 3','CR 4','CR 5'];const TREASURES = ['銅貨 (2d6×10)','銀貨 (1d6×10)','金貨 (1d6×5)','宝石','魔法のアイテム','伝説のアーティファクト'];const TRAP_TYPES = ['落とし穴','毒針トラップ','炎のトラップ','矢のトラップ','石の圧砕トラップ'];function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }let rollLog = [];let notes = [];function loadNotes() {  try { notes = JSON.parse(localStorage.getItem('dungeon_notes') || '[]'); }  catch { notes = []; }  renderNotes();}function saveNote() {  const input = document.getElementById('note-input');  const text = input.value.trim();  if (!text) return;  notes.unshift({ text, time: new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'}) });  if (notes.length > 20) notes.splice(20);  localStorage.setItem('dungeon_notes', JSON.stringify(notes));  input.value = '';  renderNotes();}function deleteNote(i) {  notes.splice(i, 1);  localStorage.setItem('dungeon_notes', JSON.stringify(notes));  renderNotes();}function renderNotes() {  const list = document.getElementById('notes-list');  if (!notes.length) { list.innerHTML = '<p class="text-indigo-700 text-xs text-center py-2">メモなし</p>'; return; }  // xss-ok: reviewed-internal-data  list.innerHTML = notes.map((n, i) => `  // xss-ok: reviewed-internal-data    <div class="note-item flex justify-between items-start gap-2 p-2 rounded text-xs text-indigo-400">      <div>        <span class="text-indigo-600">${n.time}</span>        <span class="ml-1 text-indigo-300">${escapeHtml(n.text.substring(0,80))}${n.text.length>80?'…':''}</span>      </div>      <button onclick="deleteNote(${i})" class="text-indigo-700 hover:text-red-400 shrink-0 text-sm leading-none" aria-label="メモを削除">×</button>    </div>`).join('');}function rollDice(sides) {  const dieEl = document.getElementById(`die-${sides}`);  if (dieEl) {    dieEl.classList.remove('dice-spin');    void dieEl.offsetWidth;    dieEl.classList.add('dice-spin');    setTimeout(() => dieEl.classList.remove('dice-spin'), 600);  }  const result = rand(1, sides);  logRoll(`d${sides}`, [result], result);  showDiceResult([result], `d${sides}`, result);  return result;}function rollMultiple() {  const count = Math.min(20, Math.max(1, parseInt(document.getElementById('dice-count').value) || 2));  const sides = parseInt(document.getElementById('dice-sides').value);  const rolls = Array.from({length: count}, () => rand(1, sides));  const total = rolls.reduce((a,b) => a+b, 0);  logRoll(`${count}d${sides}`, rolls, total);  showDiceResult(rolls, `${count}d${sides}`, total);}function showDiceResult(rolls, label, total) {  const el = document.getElementById('dice-result');  // xss-ok: reviewed-internal-data  el.innerHTML = `    <div class="result-pop">      <div class="text-3xl font-bold text-indigo-100 mb-1">${total}</div>      <div class="text-indigo-400 text-xs">${label} → [${rolls.join(', ')}]</div>    </div>`; // xss-ok: computed}function logRoll(label, rolls, total) {  rollLog.unshift({ label, rolls, total, time: new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit',second:'2-digit'}) });  if (rollLog.length > 50) rollLog.splice(50);  renderRollLog();}function renderRollLog() {  const log = document.getElementById('roll-log');  if (!rollLog.length) { log.innerHTML = '<div class="text-center text-indigo-700">まだロールがありません</div>'; return; }  // xss-ok: reviewed-internal-data  log.innerHTML = rollLog.map(r =>  // xss-ok: reviewed-internal-data    `<div class="flex items-center gap-2 py-0.5">      <span class="text-indigo-700 w-16 shrink-0">${r.time}</span>      <span class="text-indigo-400 w-16 shrink-0 font-mono">${r.label}</span>      <span class="text-indigo-200 font-bold w-8 text-right">${r.total}</span>      <span class="text-indigo-700 truncate">[${r.rolls.join(',')}]</span>    </div>`).join(''); // xss-ok: computed}function getEncounter(roll) {  for (const enc of ENCOUNTER_TABLE) {    if (roll >= enc.range[0] && roll <= enc.range[1]) return enc;  }  return ENCOUNTER_TABLE[0];}function generateRoom() {  // Roll all dice  const roomRoll  = rand(1,6);  const sizeRoll  = rand(1,4);  const exitRoll  = rand(1,4);  const encRoll   = rand(1,20);  const monRoll   = rand(1,8);  const treasRoll = rand(1,6);  const trapRoll  = rand(1,5);  const roomType = ROOM_TYPES[roomRoll - 1];  const size = SIZES[sizeRoll - 1];  const numExits = exitRoll;  const exits = Array.from({length: numExits}, (_,i) => DIRECTIONS[i % 4]);  const encounter = getEncounter(encRoll);  const monster = MONSTERS[monRoll - 1];  const monsterCR = MONSTER_CR[monRoll - 1];  const treasure = TREASURES[treasRoll - 1];  const trap = TRAP_TYPES[trapRoll - 1];  // Log key rolls  logRoll('d6(部屋)', [roomRoll], roomRoll);  logRoll('d4(サイズ)', [sizeRoll], sizeRoll);  logRoll('d20(エンカウント)', [encRoll], encRoll);  const severityTag = {    safe: 'bg-green-900/50 text-green-300',    low:  'bg-yellow-900/50 text-yellow-300',    mid:  'bg-orange-900/50 text-orange-300',    treasure: 'bg-amber-900/50 text-amber-300',    boss: 'bg-red-900/50 text-red-300',  }[encounter.severity];  const showMonster = ['low','mid','boss'].includes(encounter.severity);  const showTreasure = ['treasure','boss','mid'].includes(encounter.severity);  const showTrap = roomType.name === '罠部屋' || (encRoll >= 11 && encRoll <= 15);  const html = `    <div class="room-card rounded-xl p-6 fade-slide">      <!-- Header -->      <div class="flex items-start gap-4 mb-5">        <div class="text-5xl" aria-hidden="true">${roomType.icon}</div>        <div class="flex-1">          <div class="flex items-center gap-2 flex-wrap">            <h2 class="text-xl font-bold text-indigo-100">${roomType.name}</h2>            <span class="tag bg-indigo-900/60 text-indigo-300">${roomType.en}</span>          </div>          <p class="text-indigo-400 text-sm mt-1">${roomType.desc}</p>        </div>      </div>      <!-- Stats grid -->      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">        <div class="bg-indigo-950/60 rounded-lg p-3 text-center">          <div class="text-indigo-500 text-xs mb-1">サイズ</div>          <div class="text-indigo-200 text-sm font-medium">${size}</div>          <div class="text-indigo-700 text-xs">d4=<strong>${sizeRoll}</strong></div>        </div>        <div class="bg-indigo-950/60 rounded-lg p-3 text-center">          <div class="text-indigo-500 text-xs mb-1">出口</div>          <div class="text-indigo-200 text-sm font-medium">${numExits}方向</div>          <div class="flex gap-1 justify-center mt-1">            ${exits.map(d => `<div class="exit-dot" title="${d}方向"></div>`).join('')}          </div>        </div>        <div class="bg-indigo-950/60 rounded-lg p-3 text-center col-span-2">          <div class="text-indigo-500 text-xs mb-1">出口方向</div>          <div class="text-indigo-200 text-sm font-medium">${exits.join('・')}方向</div>          <div class="text-indigo-700 text-xs">d4=<strong>${exitRoll}</strong></div>        </div>      </div>      <!-- Encounter -->      <div class="bg-indigo-950/60 rounded-xl p-4 mb-4">        <div class="flex items-center gap-2 mb-2">          <span class="text-indigo-400 text-sm font-semibold">エンカウント</span>          <span class="tag ${severityTag}">${encounter.label}</span>          <span class="text-indigo-700 text-xs ml-auto">d20=<strong class="text-indigo-400">${encRoll}</strong></span>        </div>        <p class="text-indigo-300 text-sm">${encounter.desc}</p>      </div>      ${showMonster ? `      <div class="bg-red-950/40 border border-red-900/40 rounded-xl p-4 mb-4">        <div class="flex items-center gap-2 mb-2">          <span class="text-red-300 text-sm font-semibold">⚔ モンスター</span>          <span class="tag bg-red-900/50 text-red-300">${monsterCR}</span>          <span class="text-indigo-700 text-xs ml-auto">d8=<strong class="text-indigo-400">${monRoll}</strong></span>        </div>        <div class="text-red-200 font-bold text-lg">${monster}</div>        <p class="text-red-400 text-xs mt-1">難易度: ${monsterCR} / グループ規模: ${encRoll >= 11 ? 'ハード' : 'ノーマル'}</p>      </div>` : ''}      ${showTreasure ? `      <div class="bg-amber-950/40 border border-amber-900/40 rounded-xl p-4 mb-4">        <div class="flex items-center gap-2 mb-2">          <span class="text-amber-300 text-sm font-semibold">💰 宝物</span>          <span class="text-indigo-700 text-xs ml-auto">d6=<strong class="text-indigo-400">${treasRoll}</strong></span>        </div>        <div class="text-amber-200 font-bold">${treasure}</div>      </div>` : ''}      ${showTrap ? `      <div class="bg-orange-950/40 border border-orange-900/40 rounded-xl p-4 mb-4">        <div class="flex items-center gap-2 mb-2">          <span class="text-orange-300 text-sm font-semibold">⚠ 罠</span>          <span class="text-indigo-700 text-xs ml-auto">d5=<strong class="text-indigo-400">${trapRoll}</strong></span>        </div>        <div class="text-orange-200 font-bold">${trap}</div>        <p class="text-orange-400 text-xs mt-1">難易度: DC ${10 + rand(2,8)} / 被ダメージ: ${rand(1,4)}d${rand(4,8)}</p>      </div>` : ''}      <!-- Description -->      <div class="bg-slate-900/40 rounded-xl p-4 mt-2">        <h3 class="text-indigo-400 text-xs font-semibold mb-2 uppercase tracking-widest">ゲームマスター描写文</h3>        <p class="text-indigo-300 text-sm leading-relaxed italic">          「${roomType.desc} 部屋の${size}の空間が広がる。${exits.length}つの出口が${exits.join('・')}方向に続いている。          ${encounter.desc}          ${showMonster ? `${monster}の気配を感じる。` : ''}          ${showTreasure ? `奥の隅に${treasure}が輝いている。` : ''}          ${showTrap ? `床の${trap}には注意が必要だ。` : ''}」        </p>      </div>      <div class="mt-3 text-indigo-700 text-xs text-right">生成時刻: ${new Date().toLocaleTimeString('ja-JP')}</div>    </div>`;  document.getElementById('room-placeholder').classList.add('hidden');  const result = document.getElementById('room-result');  result.classList.remove('hidden');  result.innerHTML = html; // xss-ok: internal constant, computed}document.addEventListener('keydown', e => {  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;  const keyMap = { '4': 4, '6': 6, '8': 8, '0': 10, '2': 12, 'Enter': 20, 'Space': 20 };  if (e.key === 'r' || e.key === 'R') generateRoom();});loadNotes();</script></body></html>
